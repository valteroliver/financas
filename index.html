<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Finanças Pessoais</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --blue-main: #2563eb;
      --blue-gradient: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --green: #10b981;
      --red: #ef4444;
      --shadow: 0 4px 15px -2px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Tela de Bloqueio / PIN */
    #lockscreen {
      position: fixed; inset: 0; background: var(--blue-gradient); z-index: 1000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: white; padding: 20px;
    }
    .pin-display { display: flex; gap: 15px; margin: 25px 0; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid white; }
    .pin-dot.filled { background: white; }
    .teclado-pin { display: grid; grid-template-columns: repeat(3, 75px); gap: 15px; }
    .btn-pin { width: 75px; height: 75px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Topo do App (Header Azul das Fotos) */
    .top-header { background: var(--blue-gradient); color: white; padding: 30px 20px 25px; border-radius: 0 0 28px 28px; }
    .header-saudacao { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .header-saudacao h2 { font-size: 20px; }
    .header-saudacao p { font-size: 13px; opacity: 0.8; }
    .saldo-box { background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); padding: 18px; border-radius: 20px; margin-top: 10px; }
    .saldo-box .label { font-size: 13px; opacity: 0.85; }
    .saldo-box .valor { font-size: 30px; font-weight: bold; margin-top: 4px; }

    /* Resumo Balanço Branco Flutuante */
    .balanco-card { background: var(--card); border-radius: 20px; margin: -20px 20px 15px; padding: 15px; box-shadow: var(--shadow); display: flex; justify-content: space-around; text-align: center; }
    .balanco-item span { font-size: 12px; color: var(--text-muted); display: block; }
    .balanco-item strong { font-size: 15px; display: block; margin-top: 4px; }

    /* Atalhos Rápidos da Foto 8 */
    .atalhos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 20px; }
    .atalho-card { background: var(--card); border-radius: 16px; padding: 14px 10px; text-align: center; box-shadow: var(--shadow); border: none; cursor: pointer; }
    .atalho-icon { font-size: 22px; margin-bottom: 6px; }
    .atalho-label { font-size: 12px; font-weight: 600; color: var(--text); }

    /* Seções e Cards Gerais */
    .container { padding: 0 20px; }
    .card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 15px; }
    .card-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* Lista de Contas a Pagar / Lançamentos */
    .item-financeiro { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
    .item-financeiro:last-child { border-bottom: none; }
    .item-info strong { font-size: 14px; display: block; }
    .item-info span { font-size: 12px; color: var(--text-muted); }

    /* Menu Inferior Fixo */
    .menu-inferior { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 10px 0 12px; z-index: 50; }
    .menu-btn { border: none; background: transparent; font-size: 10px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .menu-btn.active { color: var(--blue-main); font-weight: bold; }
    .menu-btn span.icon { font-size: 20px; }

    /* Modal Rápido de Lançamento (Tela 02) */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: flex-end; justify-content: center; }
    .modal.active { display: flex; }
    .modal-corpo { background: var(--card); border-radius: 28px 28px 0 0; width: 100%; max-width: 480px; padding: 24px; animation: slide 0.2s ease; }
    @keyframes slide { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .tipo-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .tipo-btn { padding: 12px; border: 1px solid #e2e8f0; background: white; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .tipo-btn.selected-despesa { background: #fee2e2; color: var(--red); border-color: var(--red); }
    .tipo-btn.selected-receita { background: #dcfce7; color: var(--green); border-color: var(--green); }
    .tipo-btn.selected-transf { background: #dbeafe; color: var(--blue-main); border-color: var(--blue-main); }
    
    input, select { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 15px; }
    .btn-salvar { background: var(--blue-main); color: white; border: none; width: 100%; padding: 15px; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Tela de Acesso por Senha / PIN -->
  <div id="lockscreen">
    <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
    <h3>Finanças Pessoais</h3>
    <p style="font-size: 13px; opacity: 0.8; margin-top: 4px;">Digite seu PIN de 4 dígitos</p>
    
    <div class="pin-display">
      <div class="pin-dot" id="dot-0"></div>
      <div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div>
      <div class="pin-dot" id="dot-3"></div>
    </div>

    <div class="teclado-pin">
      <button class="btn-pin" onclick="digitarPin('1')">1</button>
      <button class="btn-pin" onclick="digitarPin('2')">2</button>
      <button class="btn-pin" onclick="digitarPin('3')">3</button>
      <button class="btn-pin" onclick="digitarPin('4')">4</button>
      <button class="btn-pin" onclick="digitarPin('5')">5</button>
      <button class="btn-pin" onclick="digitarPin('6')">6</button>
      <button class="btn-pin" onclick="digitarPin('7')">7</button>
      <button class="btn-pin" onclick="digitarPin('8')">8</button>
      <button class="btn-pin" onclick="digitarPin('9')">9</button>
      <button class="btn-pin" onclick="limparPin()">✕</button>
      <button class="btn-pin" onclick="digitarPin('0')">0</button>
      <button class="btn-pin" onclick="autenticarBiometria()">👆</button>
    </div>
  </div>

  <!-- Tela 01: Painel Principal (Dashboard) -->
  <div id="app-view">
    <div class="top-header">
      <div class="header-saudacao">
        <div>
          <h2>Olá, Bem-vindo 👋</h2>
          <p id="labelMesAno">Visão Geral do Mês</p>
        </div>
      </div>
      <div class="saldo-box">
        <div class="label">Saldo Consolidado</div>
        <div class="valor" id="dashSaldo">R$ 0,00</div>
      </div>
    </div>

    <div class="balanco-card">
      <div class="balanco-item">
        <span>Receitas</span>
        <strong style="color: var(--green);" id="dashReceitas">+ R$ 0,00</strong>
      </div>
      <div class="balanco-item">
        <span>Despesas</span>
        <strong style="color: var(--red);" id="dashDespesas">- R$ 0,00</strong>
      </div>
      <div class="balanco-item">
        <span>Economia</span>
        <strong style="color: var(--blue-main);" id="dashSaldoMes">R$ 0,00</strong>
      </div>
    </div>

    <!-- 3 Atalhos Rápidos (Foto 8) -->
    <div class="atalhos-grid">
      <button class="atalho-card" onclick="abrirModal('despesa')">
        <div class="atalho-icon">📝</div>
        <div class="atalho-label">Registrar Gasto</div>
      </button>
      <button class="atalho-card" onclick="alert('Em breve: Orçamento Inteligente')">
        <div class="atalho-icon">📊</div>
        <div class="atalho-label">Ver Orçamento</div>
      </button>
      <button class="atalho-card" onclick="alert('Em breve: Calendário e Vencimentos')">
        <div class="atalho-icon">📅</div>
        <div class="atalho-label">Próximas Contas</div>
      </button>
    </div>

    <div class="container">
      <!-- Gráfico de Evolução -->
      <div class="card">
        <div class="card-title">
          <span>Evolução Recente</span>
        </div>
        <canvas id="graficoEvolucao" height="150"></canvas>
      </div>

      <!-- Alerta Contas / Lançamentos Recentes -->
      <div class="card">
        <div class="card-title">
          <span>Últimas Movimentações</span>
        </div>
        <div id="listaUltimas"></div>
      </div>
    </div>
  </div>

  <!-- Tela 02: Modal Adicionar Lançamento Rápido -->
  <div class="modal" id="modalLancamento">
    <div class="modal-corpo">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>Novo Lançamento</h3>
        <span style="font-size:22px; cursor:pointer;" onclick="fecharModal()">✕</span>
      </div>

      <div class="tipo-tabs">
        <button class="tipo-btn selected-despesa" id="btn-tipo-despesa" onclick="setTipo('despesa')">Despesa</button>
        <button class="tipo-btn" id="btn-tipo-receita" onclick="setTipo('receita')">Receita</button>
        <button class="tipo-btn" id="btn-tipo-transf" onclick="setTipo('transf')">Transf.</button>
      </div>

      <input type="text" id="campoDescricao" placeholder="Descrição (ex: Almoço, Salário)">
      <input type="number" id="campoValor" placeholder="R$ 0,00" step="0.01">
      <select id="campoCategoria"></select>
      <input type="date" id="campoData">

      <button class="btn-salvar" onclick="salvarLancamento()">Salvar Lançamento</button>
    </div>
  </div>

  <!-- Menu Inferior de 5 Ícones -->
  <div class="menu-inferior">
    <button class="menu-btn active">
      <span class="icon">🏠</span>
      <span>Início</span>
    </button>
    <button class="menu-btn" onclick="alert('Em construção: Orçamentos')">
      <span class="icon">📊</span>
      <span>Orçamento</span>
    </button>
    <button class="menu-btn" onclick="abrirModal('despesa')" style="color:var(--blue-main);">
      <span class="icon" style="font-size:26px;">➕</span>
      <span>Novo</span>
    </button>
    <button class="menu-btn" onclick="alert('Em construção: Metas e Dívidas')">
      <span class="icon">🎯</span>
      <span>Metas</span>
    </button>
    <button class="menu-btn" onclick="bloquearApp()">
      <span class="icon">🔒</span>
      <span>Bloquear</span>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
